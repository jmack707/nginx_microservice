- name: Install cert-manager Helm chart
  kubernetes.core.helm:
    release_name: cert-manager                # The name of the Helm release
    chart_ref: oci://harbor.test.local/library/cert-manager  # OCI chart reference
    chart_version: v1.14.4                     # Helm chart version
    namespace: cert-manager                   # Kubernetes namespace for the release
    create_namespace: true                    # Create the namespace if it doesn't exist
    values:                                   # Override chart values
      installCRDs: true                      # Set Helm values directly
      global:
        imageRegistry: harbor.test.local/library
      controller:
        image:
          repository: quay.io/jetstack/cert-manager-controller
    state: "{{ package_state }}"
                                # Custom values overriding the chart defaults


- name: Create or update the TLS secret
  kubernetes.core.k8s:
    state: "{{ package_state }}"
    kubeconfig: /home/{{admin_account}}/.kube/config
    definition: "{{ lookup('template', 'templates/tls.secret.j2') | from_yaml_all }}"

- name: Create Cluster Issuser
  kubernetes.core.k8s:
    state: "{{ package_state }}"
    kubeconfig: /home/{{admin_account}}/.kube/config
    definition: "{{ lookup('template', 'templates/clusterissuer.j2') | from_yaml_all }}"