- name: Install cert-manager Helm chart
  kubernetes.core.helm:
    release_name: cert-manager                # The name of the Helm release
    chart_ref: oci://harbor.test.local/library/cert-manager  # OCI chart asereference
    namespace: cert-manager                   # Kubernetes namespace for the release
    chart_version: "{{cert_manager_chart}}"
    create_namespace: true                    # Create the namespace if it doesn't exist
    values: "{{ lookup('template', 'values.j2') | from_yaml }}"
    state: "{{ package_state }}"
    kubeconfig: /home/ubuntu/.kube/config
  register: helm_result

- name: Debug Helm install result
  debug:
      var: helm_result                           

- name:  Manager Cert Manager TLS secret
  kubernetes.core.k8s:
    state: "{{ package_state }}"
    kubeconfig: /home/{{admin_account}}/.kube/config
    definition: "{{ lookup('template', 'templates/tls.secret.j2') | from_yaml_all }}"

- name: Manager Cluster Issuser
  kubernetes.core.k8s:
    state: "{{ package_state }}"
    kubeconfig: /home/{{admin_account}}/.kube/config
    definition: "{{ lookup('template', 'templates/clusterissuer.j2') | from_yaml_all }}"
  when: package_state == "present"
