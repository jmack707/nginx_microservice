---
# Deploy Ingresslink with ExternalDNS
- name: Deploy Ingresslink with ExternalDNS
  hosts: master
  gather_facts: false

  vars_files:
    - ../vars/k8s_secret.yaml
      ../vars/image_locations

  vars:
      package_state: present
      secret_state: create
      syslog-image: harbor.test.local/library/balabit/syslog-ng
      nginx-image: harbor.test.local/library/nginx/nginx-ingress
      cis-image: harbor.test.local/library/f5networks/k8s-bigip-ctlr
      nginx-image: harbor.test.local/library/nginx/nginx-ingress
      

  tasks:
    - name: Install Python Kubernetes 
      import_role:
        name: python_k8s

    - name: Install Cert Manager
      import_role:
        name: manage_cert_manager

    - name: CIS  
      import_role:
        name: manage_cis_deployment

    - name: NIC  
      import_role:
        name: manage_nic_deployment

    - name: Syslog
      import_role:
        name: manage_syslog_deployment
