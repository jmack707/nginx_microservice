---
- name: Load Docker images and push to Harbor
  hosts: localhost
  gather_facts: false
  become: true
  vars:
    harbor_registry_url: "harbor.test.local/library"        # Harbor registry URL
    harbor_username: "admin"                                # Harbor username
    harbor_password: "Harbor12345"                          # Harbor password
    docker_images_with_files:                               # Combine `image_files` with `docker_images`
      - image_file: "/tmp/nginx_nginx-ingress_latest.tar"
        name: "nginx/nginx-ingress"
        tag: "latest"
      - image_file: "/tmp/f5networks_k8s-bigip-ctlr_latest.tar"
        name: "f5networks/k8s-bigip-ctlr"
        tag: "latest"
      - image_file: "/tmp/nginxdemos_nginx-hello_latest.tar"
        name: "nginxdemos/nginx-hello"
        tag: "latest"
      - image_file: "/tmp/balabit_syslog-ng_latest.tar"
        name: "balabit/syslog-ng"
        tag: "latest"
      - image_file: "quay.io/jetstack/cert-manager-cainjector"
        tag: "v1.17.0"
      - image_file: "quay.io/jetstack/cert-manager-webhook"
        tag: "v1.17.0"

  tasks:
    - name: Log in to Harbor Registry
      community.docker.docker_login:
        registry_url: "{{ harbor_registry_url }}"
        username: "{{ harbor_username }}"
        password: "{{ harbor_password }}"

    - name: Load images from .tar files and push to Harbor
      community.docker.docker_image:
        name: "{{ harbor_registry_url }}/{{ item.name }}"  # Full registry image path
        tag: "{{ item.tag }}"
        push: true
        load_path: "{{ item.image_file }}"  # Load from the .tar file
        source: load
      loop: "{{ docker_images_with_files }}"
      loop_control:
        label: "{{ item.name }}"  # Clearly show the current image name being processed